# The settings of `cargo about` for scripts/generate-licenses.sh: which Rust crates are in the licenses file, and which licenses may be there.
# The crates are the ones that the program of an installer is linked with: the normal dependencies of the workspace for the four systems
# of the installers (build scripts and tests are not shipped).
accepted = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
