name: Bug report
description: Something in Dictate doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem, please don't open an issue: follow [SECURITY.md](https://github.com/henryonai/dictate/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click into a Slack message box
        2. Press Ctrl+Alt+Space and say a sentence
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation
        - Writing into text fields
        - Screen or audio recording
        - Files and YouTube links
        - Transcription (Whisper or an API)
        - Summaries and the library
        - MCP server (Claude)
        - Settings and API keys
        - Installing or updating
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dictate version
      description: The release you installed, as in the name of the installer (Dictate_2.0.0_amd64.deb is 2.0.0), or the commit you built.
      placeholder: 2.0.0, or the commit you built
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux (X11)
        - Linux (Wayland)
        - Other
    validations:
      required: true
  - type: input
    id: system-version
    attributes:
      label: System version, and on Linux the distribution and desktop
      placeholder: "macOS 15.2, Windows 11 23H2, or Ubuntu 24.04 with GNOME 46"
    validations:
      required: true
  - type: dropdown
    id: installer
    attributes:
      label: How you installed it
      options:
        - .dmg (macOS)
        - .exe installer (Windows)
        - .deb (Linux)
        - Built from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: For a recording, in the library click ⋯ → View log → Copy, and paste it here. For anything else, start Dictate from a terminal with RUST_LOG=dictate=debug and paste what it prints.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed API keys, names and anything private from what I pasted.
          required: true
