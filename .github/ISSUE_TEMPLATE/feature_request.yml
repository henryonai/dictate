name: Feature request
description: An idea that would make Dictate more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, rather than the solution. For example "I dictate in two languages in the same message".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help?
      description: How you picture it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
