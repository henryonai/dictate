name: Release

# On every push to main, release-please keeps a release PR up to date: the next version (from Conventional
# Commits since the last release) in every file that holds it (release-please-config.json lists them) and the
# notes in CHANGELOG.md. Merging that PR tags the release and publishes it; the build job then builds the
# installers (release.yml) and attaches them to it.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with the workflow token starts no other workflow, so the build runs from here.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
