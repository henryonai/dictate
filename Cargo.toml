[workspace]
# Resolver 3 picks dependency versions that build with the workspace rust-version.
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
# The one version of the app and of every crate. release-please bumps it together with app/ui/package.json, version.txt
# and the crates in Cargo.lock (release-please-config.json lists the files).
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# opus-decoder 0.1.1 sets bit `i` of a u8 mask for up to 16 short blocks of a transient frame (celt/vq.rs), as libopus
# does in an unsigned char that drops the bits above the 8th. Where overflow checks are on (debug builds and tests)
# that shift panics on a frame an ordinary encoder makes; where they are off (release) it is the same code without the
# panic. Debug and tests run the way release does.
[profile.dev.package.opus-decoder]
overflow-checks = false

# The speaker separation models are checked by their SHA-256 (46 MB): unoptimized, that takes seconds in a debug build.
[profile.dev.package.sha2]
opt-level = 3
