[package]
name = "dictate-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Dictate desktop app: tray, settings window and the commands behind it"

# The command people type for `dictate --toggle` and the name of the process.
[[bin]]
name = "dictate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dictate-core = { path = "../../crates/dictate-core" }
dictate-services = { path = "../../crates/dictate-services" }
dirs = "7.0.0"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4"
reqwest = { version = "0.12.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio-util = { version = "0.7.20", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
